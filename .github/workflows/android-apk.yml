name: build-apk
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle wrapper
        run: cd android/ScanForge && gradle wrapper --gradle-version 8.7
      - name: Build debug APK
        run: cd android/ScanForge && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: scanforge-debug-apk
          path: android/ScanForge/app/build/outputs/apk/debug/app-debug.apk
