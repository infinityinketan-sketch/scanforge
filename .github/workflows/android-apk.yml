name: build-apk
on:
  push:
    paths: ["app/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend URL baked into the APK"
        default: "https://scanforge-api.onrender.com"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle 8.7 on PATH; no wrapper is committed, so call `gradle` directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug -PapiBase=${{ inputs.api_base || 'https://scanforge-api.onrender.com' }}

      - uses: actions/upload-artifact@v4
        with:
          name: scanforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
