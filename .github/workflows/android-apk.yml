name: build-apk
on:
  push:
    paths: ["app/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend URL baked into the APK"
        default: "https://chamber-barber-dole.ngrok-free.dev"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle 8.7 on PATH; no wrapper is committed, so call `gradle` directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain \
            -PapiBase=${{ inputs.api_base || 'https://chamber-barber-dole.ngrok-free.dev' }} 2>&1 | tee build.log

      # Surface compiler/Gradle errors on the run page instead of only "exit code 1".
      - name: Report build errors
        if: failure()
        run: |
          grep -E -A4 '^e: |What went wrong|^ERROR' build.log | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: scanforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
