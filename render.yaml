# Production backend on Render. Create it from this file ("New > Blueprint" in Render),
# then paste the secret values (sync: false) in the dashboard. See README "Going live".
services:
  - type: web
    name: scanforge-api
    # Docker image = the API plus Litestream (continuous database copy to R2). See backend/Dockerfile.
    # One uvicorn worker: the background processor and SQLite expect a single process.
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    # Always-on paid instance: a persistent disk needs one, and customers' points live on it.
    plan: starter
    disk:
      name: scanforge-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production          # refuses to start with test-payment or default-secret settings
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: API_BASE
        value: https://scanforge-api.onrender.com   # change if Render gives the service another name
      - key: ALLOW_DEV_BILLING
        value: "0"                 # never 1 in production
      # Google Play purchase verification (service account JSON, pasted in the dashboard)
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PLAY_PACKAGE_NAME
        value: com.scanforge.app
      # 3D services (only options whose key is set are offered in the app)
      - key: FAL_KEY
        sync: false
      - key: TRIPO_API_KEY
        sync: false
      - key: KIRI_API_KEY
        sync: false
      # Points and packs (1 point = ₹1). Keep PACK_PRICES equal to the Play Console prices.
      - key: TIER_POINTS
        value: basic=29,quick=99,hq=249
      - key: POINT_PACKS
        value: points_100=100,points_300=300,points_1000=1000
      - key: PACK_PRICES
        value: points_100=₹99,points_300=₹279,points_1000=₹849
      - key: WELCOME_POINTS
        value: "0"
      # Cloudflare R2: photos and models (phone uploads/downloads directly), the live database
      # copy (Litestream) and daily backups. Without R2_BUCKET everything stays on the disk.
      - key: R2_ENDPOINT
        sync: false                # https://<account id>.r2.cloudflarestorage.com
      - key: R2_BUCKET
        sync: false
      - key: R2_KEY_ID
        sync: false
      - key: R2_SECRET
        sync: false
      - key: RETENTION_DAYS
        value: "90"                # photos and models are deleted this long after a scan
      # Privacy notice (GET /privacy)
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: PRIVACY_COMPANY
        sync: false
